name: malvifactor
description: Application personnelle de suivi nutritionnel et de calcul adaptatif du TDEE.
publish_to: "none"
version: 1.4.0+21

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.3
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  intl: ">=0.19.0 <0.21.0"
  google_fonts: ^6.2.1
  mobile_scanner: ^6.0.2
  lucide_icons_flutter: ^4.0.3
  fl_chart: ^0.70.2
  health: ^12.1.0
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.14.0
  package_info_plus: ^8.1.2
  path_provider: ^2.1.5
  open_filex: ^4.5.1
  shared_preferences: ^2.3.3
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.2
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/app_icon.png"
  adaptive_icon_background: "#0B0C0E"
  adaptive_icon_foreground: "assets/branding/app_icon_foreground.png"
  web:
    generate: true
    image_path: "assets/branding/app_icon.png"
    background_color: "#0B0C0E"
    theme_color: "#0B0C0E"
  windows:
    generate: true
    image_path: "assets/branding/app_icon.png"
    icon_size: 256

flutter_native_splash:
  color: "#0B0C0E"
  image: "assets/branding/splash_logo.png"
  android_12:
    color: "#0B0C0E"
    image: "assets/branding/splash_logo.png"
    icon_background_color: "#0B0C0E"
  web: true
